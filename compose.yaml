services:
  postgres:
    environment:
      POSTGRES_DB: yeongbeen
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d yeongbeen']
      interval: 5s
      timeout: 5s
      retries: 10
    image: postgres:17-alpine
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    command: ['redis-server', '--appendonly', 'yes']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    image: redis:8-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    restart: unless-stopped
    volumes:
      - redis-data:/data

  web:
    build:
      context: .
      target: runtime
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/yeongbeen}
      HOST: 0.0.0.0
      PORT: ${PORT:-3000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    image: yeongbeen-cloud:local
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    restart: unless-stopped
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget --no-verbose --tries=1 --spider http://127.0.0.1:$${PORT}/api/health || exit 1',
        ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  postgres-data:
  redis-data:
