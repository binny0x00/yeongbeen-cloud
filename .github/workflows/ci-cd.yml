name: CI/CD

on:
  pull_request:
    branches:
      - feature/sprint-3-content-platform
      - develop
      - main
  push:
    branches:
      - feature/sprint-3-content-platform
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build application
        run: pnpm build

  infrastructure:
    name: Infrastructure integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: yeongbeen
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yeongbeen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yeongbeen
      OWNER_EMAILS: owner@example.test
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate generated migrations
        run: pnpm db:check

      - name: Apply migrations twice
        run: pnpm db:migrate && pnpm db:migrate

      - name: Seed deterministic Sprint 3 fixtures
        run: pnpm db:seed

      - name: Verify PostgreSQL and Redis adapters
        run: pnpm infrastructure:verify

      - name: Verify editor persistence and optimistic locking
        run: pnpm editor:verify

      - name: Verify comments, likes, and notifications
        run: pnpm engagement:verify

      - name: Verify AI usage accounting and privacy logging
        run: pnpm ai:verify

      - name: Verify scheduled publishing and orphan cleanup
        run: pnpm operations:verify

      - name: Verify public read p95 budget
        run: pnpm performance:verify

      - name: Verify isolated migration dry-run and rollback
        run: pnpm db:rollback:verify

      - name: Verify idempotent content import and rollback
        run: >-
          pnpm content:import &&
          pnpm content:import &&
          pnpm content:verify &&
          pnpm content:rollback &&
          pnpm content:import &&
          pnpm content:verify

  e2e:
    name: End-to-end quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: yeongbeen
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d yeongbeen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      BETTER_AUTH_SECRET: e2e-better-auth-secret-at-least-32
      BETTER_AUTH_URL: http://127.0.0.1:4173
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/yeongbeen
      E2E_TESTING: '1'
      GITHUB_CLIENT_ID: e2e-github-client
      GITHUB_CLIENT_SECRET: e2e-github-secret
      GOOGLE_CLIENT_ID: e2e-google-client
      GOOGLE_CLIENT_SECRET: e2e-google-secret
      NUXT_PUBLIC_SITE_URL: http://127.0.0.1:4173
      OWNER_EMAILS: sprint3-seed@local.invalid
      REDIS_URL: redis://127.0.0.1:6379

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply migrations and seed E2E owner
        run: pnpm db:migrate && pnpm db:seed:e2e

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run KO/EN, authoring, engagement, visual, and axe flows
        run: pnpm test:e2e

      - name: Upload Playwright screenshots, axe results, and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ github.sha }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker build
    needs:
      - quality
      - infrastructure
      - e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: yeongbeen-cloud:${{ github.sha }}
          cache-from: type=gha,scope=yeongbeen-cloud
          cache-to: type=gha,mode=max,scope=yeongbeen-cloud

  deploy:
    name: Deploy to Railway
    needs:
      - quality
      - docker
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ vars.RAILWAY_HEALTHCHECK_URL }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_HEALTHCHECK_URL: ${{ vars.RAILWAY_HEALTHCHECK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate deployment configuration
        shell: bash
        run: |
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "RAILWAY_TOKEN is not configured for the selected GitHub Environment."
            exit 1
          fi

          if [[ -z "$RAILWAY_SERVICE_ID" ]]; then
            echo "RAILWAY_SERVICE_ID is not configured for the selected GitHub Environment."
            exit 1
          fi

          if [[ -z "$RAILWAY_HEALTHCHECK_URL" ]]; then
            echo "RAILWAY_HEALTHCHECK_URL is not configured for the selected GitHub Environment."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.30.3

      - name: Deploy application
        run: railway up --ci --service "$RAILWAY_SERVICE_ID" --message "GitHub Actions ${GITHUB_SHA}"

      - name: Verify deployed service
        shell: bash
        run: |
          endpoint="${RAILWAY_HEALTHCHECK_URL%/}/api/health"

          for attempt in {1..30}; do
            echo "Health check attempt ${attempt}/30: ${endpoint}"

            if curl --fail --silent --show-error --max-time 10 "$endpoint"; then
              echo
              echo "Deployment health check passed."
              exit 0
            fi

            sleep 10
          done

          echo "Deployment health check failed after 30 attempts."
          exit 1
