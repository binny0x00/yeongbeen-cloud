name: CI/CD

on:
  pull_request:
    branches:
      - feature/sprint-1-foundation
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.12.4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Build application
        run: pnpm build

  docker:
    name: Docker build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: yeongbeen-cloud:${{ github.sha }}
          cache-from: type=gha,scope=yeongbeen-cloud
          cache-to: type=gha,mode=max,scope=yeongbeen-cloud

  deploy:
    name: Deploy to Railway
    needs:
      - quality
      - docker
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ vars.RAILWAY_HEALTHCHECK_URL }}
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_SERVICE_ID: ${{ vars.RAILWAY_SERVICE_ID }}
      RAILWAY_HEALTHCHECK_URL: ${{ vars.RAILWAY_HEALTHCHECK_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Validate deployment configuration
        shell: bash
        run: |
          if [[ -z "$RAILWAY_TOKEN" ]]; then
            echo "RAILWAY_TOKEN is not configured for the selected GitHub Environment."
            exit 1
          fi

          if [[ -z "$RAILWAY_SERVICE_ID" ]]; then
            echo "RAILWAY_SERVICE_ID is not configured for the selected GitHub Environment."
            exit 1
          fi

          if [[ -z "$RAILWAY_HEALTHCHECK_URL" ]]; then
            echo "RAILWAY_HEALTHCHECK_URL is not configured for the selected GitHub Environment."
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install --global @railway/cli@5.30.3

      - name: Deploy application
        run: railway up --ci --service "$RAILWAY_SERVICE_ID" --message "GitHub Actions ${GITHUB_SHA}"

      - name: Verify deployed service
        shell: bash
        run: |
          endpoint="${RAILWAY_HEALTHCHECK_URL%/}/api/health"

          for attempt in {1..30}; do
            echo "Health check attempt ${attempt}/30: ${endpoint}"

            if curl --fail --silent --show-error --max-time 10 "$endpoint"; then
              echo
              echo "Deployment health check passed."
              exit 0
            fi

            sleep 10
          done

          echo "Deployment health check failed after 30 attempts."
          exit 1
